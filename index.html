<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satranç Oyunu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 { margin-top: 20px; }
    #chessboard {
      display: grid;
      grid-template-columns: repeat(8, 60px);
      grid-template-rows: repeat(8, 60px);
      margin: 20px auto;
      border: 2px solid #333;
    }
    .square {
      width: 60px;
      height: 60px;
      position: relative;
      box-sizing: border-box;
    }
    .white { background-color: #f0d9b5; }
    .black { background-color: #b58863; }
    .piece {
      font-size: 32px;
      line-height: 60px;
      cursor: pointer;
      user-select: none;
    }
    #captured {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      width: 100%;
    }
    .captured-pieces {
      border: 1px solid #333;
      padding: 10px;
      width: 150px;
      min-height: 60px;
      background-color: #fff;
    }
    .captured-pieces h2 {
      margin: 0;
      font-size: 16px;
    }
    #undo {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
    .highlight {
        background-color: rgba(0, 255, 8, 0.5);
        outline: 2px solid green;
        box-shadow: 0 0 10px rgba(0, 255, 8, 0.5);
        transition: background-color 0.3s, outline 0.3s, box-shadow 0.3s;

    }
    .danger {
        background-color: rgba(255, 0, 0, 0.5);
        outline: 2px solid red;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        transition: background-color 0.3s, outline 0.3s, box-shadow 0.3s;
    }
    .selected {
        background-color: rgba(0, 0, 255, 0.5);
        outline: 2px solid blue;
        box-shadow: 0 0 10px rgba(0, 0, 255, 0.5);
        transition: background-color 0.3s, outline 0.3s, box-shadow 0.3s;
    }
  </style>
</head>
<body>
  <h1>Satranç Oyunu</h1>
  <div id="chessboard"></div>
  <div id="captured">
    <div class="captured-pieces" id="white-captured">
      <h2>Beyaz Yenen</h2>
    </div>
    <div class="captured-pieces" id="black-captured">
      <h2>Siyah Yenen</h2>
    </div>
  </div>
  <button id="undo">Hamleyi Geri Al</button>
  
  <script>
    /* 
      Bu örnekte:
      - İçsel board temsili "board" adlı 8x8 matris olarak tutulur.
      - Her hücrede null veya {  color,type, firstMove } şeklinde nesne bulunur.
      - currentTurn ile hangi rengin oynadığı takip edilir.
      - moveHistory hamleleri saklar (geri alma için).
      - enPassantTarget, piyonun çift hamlesi sonrası alınabilecek kareyi saklar.
    */
    
    const boardElement = document.getElementById('chessboard');
    const whiteCapturedEl = document.getElementById('white-captured');
    const blackCapturedEl = document.getElementById('black-captured');
    const undoButton = document.getElementById('undo');

    const pieceSymbols = {
      white: { pawn: '♙', rook: '♖', knight: '♘', bishop: '♗', queen: '♕', king: '♔' },
      black: { pawn: '♟', rook: '♜', knight: '♞', bishop: '♝', queen: '♛', king: '♚' }
    };

    let board = [];
    let currentTurn = 'white';
    let moveHistory = [];
    let enPassantTarget = null; // { row, col } hedefi

    // Seçilmiş taş için (click ile seçim yöntemi)
    let selectedSquare = null;
    let legalMoves = [];

    // Boardu başlat
    function initBoard() {
      board = [];
      for (let r = 0; r < 8; r++) {
        board[r] = [];
        for (let c = 0; c < 8; c++) {
          board[r][c] = null;
        }
      }
      // Siyah taşlar
      board[0][0] = { type: 'rook', color: 'black', firstMove: true };
      board[0][1] = { type: 'knight', color: 'black', firstMove: true };
      board[0][2] = { type: 'bishop', color: 'black', firstMove: true };
      board[0][3] = { type: 'queen', color: 'black', firstMove: true };
      board[0][4] = { type: 'king', color: 'black', firstMove: true };
      board[0][5] = { type: 'bishop', color: 'black', firstMove: true };
      board[0][6] = { type: 'knight', color: 'black', firstMove: true };
      board[0][7] = { type: 'rook', color: 'black', firstMove: true };
      for (let c = 0; c < 8; c++) {
        board[1][c] = { type: 'pawn', color: 'black', firstMove: true };
      }
      // Beyaz taşlar
      board[7][0] = { type: 'rook', color: 'white', firstMove: true };
      board[7][1] = { type: 'knight', color: 'white', firstMove: true };
      board[7][2] = { type: 'bishop', color: 'white', firstMove: true };
      board[7][3] = { type: 'queen', color: 'white', firstMove: true };
      board[7][4] = { type: 'king', color: 'white', firstMove: true };
      board[7][5] = { type: 'bishop', color: 'white', firstMove: true };
      board[7][6] = { type: 'knight', color: 'white', firstMove: true };
      board[7][7] = { type: 'rook', color: 'white', firstMove: true };
      for (let c = 0; c < 8; c++) {
        board[6][c] = { type: 'pawn', color: 'white', firstMove: true };
      }
    }

    // Tahtayı DOM’a çiz
    function renderBoard() {
      boardElement.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          square.classList.add('square');
          square.dataset.row = r;
          square.dataset.col = c;
          // Renk belirleme
          square.classList.add((r + c) % 2 === 0 ? 'white' : 'black');
          // Eğer bu kare seçilmiş veya legal hamle ise vurgula
          if (selectedSquare && selectedSquare.row == r && selectedSquare.col == c) {
            square.classList.add('selected');
          } else if (legalMoves.find(m => m.row === r && m.col === c)) {
            square.classList.add('highlight');
          }
          // Eğer herhangi bir kral check altındaysa, o kralın olduğu kareyi kırmızı işaretle
          if (isKingInCheck('white')) {
            const whiteKing = board.find((row, rowIndex) => 
              row.find((piece, colIndex) => piece?.type === 'king' && piece.color === 'white' && r === rowIndex && c === colIndex)
            );
            if (whiteKing) {
              square.classList.add('danger');
            }
          }
          // Eğer seçili taşın ele geçirebileceği taşlar varsa, onları danger yap
          if (selectedSquare) {
            const capturingMoves = legalMoves.filter(m => board[m.row][m.col] && board[m.row][m.col].color !== currentTurn);
            capturingMoves.forEach(move => {
              if (move.row === r && move.col === c) {
                square.classList.add('danger');
              }
            });
          }
          if (isKingInCheck('black')) {
            const blackKing = board.find((row, rowIndex) => 
              row.find((piece, colIndex) => piece?.type === 'king' && piece.color === 'black' && r === rowIndex && c === colIndex)
            );
            if (blackKing) {
              square.classList.add('danger');
            }
          }
          // Taş varsa ekle
          const piece = board[r][c];
          if (piece) {
            const pieceEl = document.createElement('div');
            pieceEl.classList.add('piece');
            pieceEl.textContent = pieceSymbols[piece.color][piece.type];
            square.appendChild(pieceEl);
          }
          square.addEventListener('click', onSquareClick);
          boardElement.appendChild(square);
        }
      }
    }

    // Kare tıklama işlemi: önce seçim, sonra hamle
    function onSquareClick(e) {
      const row = parseInt(e.currentTarget.dataset.row);
      const col = parseInt(e.currentTarget.dataset.col);
      const clickedPiece = board[row][col];

      // Eğer zaten taş seçiliyse ve tıklanan kare yasal hamle ise hamleyi yap
      if (selectedSquare) {
        if (legalMoves.find(m => m.row === row && m.col === col)) {
          makeMove(selectedSquare.row, selectedSquare.col, row, col);
          clearSelection();
          renderBoard();
          checkGameState();
          return;
        }
      }
      // Seçim: yalnızca kendi renginizin taşını seçebilirsiniz
      if (clickedPiece && clickedPiece.color === currentTurn) {
        selectedSquare = { row, col };
        legalMoves = getLegalMoves(row, col, clickedPiece);
      } else {
        clearSelection();
      }
      renderBoard();
    }

    function clearSelection() {
      selectedSquare = null;
      legalMoves = [];
    }

    // Belirli bir hamlenin kurallara uygunluğunu kontrol eden fonksiyon
    function isValidMove(piece, fromRow, fromCol, toRow, toCol, considerKingSafety = true) {
      // Hedef kare üzerinde kendi taşınız varsa geçersiz
      const target = board[toRow][toCol];
      if (target && target.color === piece.color) return false;

      const rowDiff = toRow - fromRow;
      const colDiff = toCol - fromCol;
      let valid = false;

      // Her taş için hareket kuralları
      switch (piece.type) {
        case 'pawn':
          let direction = (piece.color === 'white') ? -1 : 1;
          // Normal hamle
          if (colDiff === 0 && rowDiff === direction && !target) {
            valid = true;
          }
          // İki kare ileri (ilk hamlede)
          else if (colDiff === 0 && rowDiff === 2 * direction && piece.firstMove && !target) {
            // İkinci kare boş mu?
            if (!board[fromRow + direction][fromCol]) {
              valid = true;
              // En passant için hedef kareyi ayarla
            }
          }
          // Çapraz alım
          else if (Math.abs(colDiff) === 1 && rowDiff === direction) {
            if (target && target.color !== piece.color) {
              valid = true;
            }
            // En passant
            else if (!target && enPassantTarget && enPassantTarget.row === toRow && enPassantTarget.col === toCol) {
              valid = true;
            }
          }
          break;
        case 'rook':
          if (rowDiff === 0 || colDiff === 0) {
            valid = pathClear(fromRow, fromCol, toRow, toCol);
          }
          break;
        case 'bishop':
          if (Math.abs(rowDiff) === Math.abs(colDiff)) {
            valid = pathClear(fromRow, fromCol, toRow, toCol);
          }
          break;
        case 'queen':
          if (rowDiff === 0 || colDiff === 0 || Math.abs(rowDiff) === Math.abs(colDiff)) {
            valid = pathClear(fromRow, fromCol, toRow, toCol);
          }
          break;
        case 'knight':
          if ((Math.abs(rowDiff) === 2 && Math.abs(colDiff) === 1) ||
              (Math.abs(rowDiff) === 1 && Math.abs(colDiff) === 2)) {
            valid = true;
          }
          break;
        case 'king':
          // Normal hamle
          if (Math.abs(rowDiff) <= 1 && Math.abs(colDiff) <= 1) {
            valid = true;
          }
          // Rok: Kral ve kalenin daha önce hamle yapmamış olması, arada taş bulunmaması ve kralın geçiş sırasında check olmaması gerekir
          else if (piece.firstMove && rowDiff === 0 && Math.abs(colDiff) === 2) {
            // Kısa rok veya uzun rok
            let rookCol = (colDiff > 0) ? 7 : 0;
            let rook = board[fromRow][rookCol];
            if (rook && rook.type === 'rook' && rook.firstMove) {
              // Aradaki karelerin boşluğu
              let step = colDiff > 0 ? 1 : -1;
              let clear = true;
              for (let c = fromCol + step; c !== rookCol; c += step) {
                if (board[fromRow][c]) {
                  clear = false;
                  break;
                }
              }
              if (clear) {
                // Ekstra: kralın geçeceği kareler check olmamalı
                if (!wouldBeInCheck(piece.color, fromRow, fromCol, fromRow, fromCol + step) &&
                    !wouldBeInCheck(piece.color, fromRow, fromCol, fromRow, fromCol + 2*step)) {
                  valid = true;
                }
              }
            }
          }
          break;
      }

      // Eğer hamle geçerliyse, ama hamle sonrası kendi şahınızın check olup olmayacağını da kontrol etmeliyiz
      if (valid && considerKingSafety) {
        // Geçici hamle yapıp şah kontrolü
        let backupFrom = board[fromRow][fromCol];
        let backupTo = board[toRow][toCol];
        board[toRow][toCol] = board[fromRow][fromCol];
        board[fromRow][fromCol] = null;
        // En passant: eğer hamlede en passant varsa, yakalanan piyon geçici olarak kaldırılır
        let epRemoved = null;
        if (backupFrom.type === 'pawn' && Math.abs(rowDiff) === 1 && Math.abs(colDiff) === 1 && !backupTo) {
          let pawnRow = fromRow;
          let removedRow = pawnRow;
          if (piece.color === 'white') removedRow = toRow + 1;
          else removedRow = toRow - 1;
          epRemoved = board[removedRow][toCol];
          board[removedRow][toCol] = null;
        }
        let kingSafe = !isKingInCheck(piece.color);
        // Hamleyi geri al
        board[fromRow][fromCol] = backupFrom;
        board[toRow][toCol] = backupTo;
        if (epRemoved) {
          board[piece.color === 'white' ? 3 : 4][toCol] = epRemoved;
        }
        if (!kingSafe) valid = false;
      }

      return valid;
    }

    // Yatay/dikey/çapraz yolun boş olup olmadığını kontrol et
    function pathClear(fromRow, fromCol, toRow, toCol) {
      let rowStep = (toRow - fromRow) === 0 ? 0 : (toRow - fromRow) / Math.abs(toRow - fromRow);
      let colStep = (toCol - fromCol) === 0 ? 0 : (toCol - fromCol) / Math.abs(toCol - fromCol);
      let currentRow = fromRow + rowStep;
      let currentCol = fromCol + colStep;
      while (currentRow !== toRow || currentCol !== toCol) {
        if (board[currentRow][currentCol]) return false;
        currentRow += rowStep;
        currentCol += colStep;
      }
      return true;
    }

    // Hamle sonrası şahın check durumunu kontrol et
    function isKingInCheck(color) {
      let kingPos = null;
      // Şahın pozisyonunu bul
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          let piece = board[r][c];
          if (piece && piece.type === 'king' && piece.color === color) {
            kingPos = { row: r, col: c };
            break;
          }
        }
        if (kingPos) break;
      }
      if (!kingPos) return true; // Şah yoksa zaten problem var

      // Tüm rakip taşların hamlelerini kontrol et
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          let piece = board[r][c];
          if (piece && piece.color !== color) {
            if (isValidMove(piece, r, c, kingPos.row, kingPos.col, false)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // Gelecek hamlede şahın check olup olmayacağını kontrol etmek için
    function wouldBeInCheck(color, fromRow, fromCol, toRow, toCol) {
      let backupFrom = board[fromRow][fromCol];
      let backupTo = board[toRow][toCol];
      board[toRow][toCol] = backupFrom;
      board[fromRow][fromCol] = null;
      let check = isKingInCheck(color);
      board[fromRow][fromCol] = backupFrom;
      board[toRow][toCol] = backupTo;
      return check;
    }

    // Verilen taşın yasal hamlelerini döndürür
    function getLegalMoves(row, col, piece) {
      let moves = [];
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (isValidMove(piece, row, col, r, c)) {
            moves.push({ row: r, col: c });
          }
        }
      }
      return moves;
    }

    // Hamleyi uygula (özel durumlar: en passant, rok, terfi)
    function makeMove(fromRow, fromCol, toRow, toCol) {
      let piece = board[fromRow][fromCol];
      let target = board[toRow][toCol];
      // Hamle geçmişini sakla (geri alma için)
      let moveRecord = {
        piece: { ...piece },
        from: { row: fromRow, col: fromCol },
        to: { row: toRow, col: toCol },
        captured: target ? { ...target } : null,
        enPassantTarget: enPassantTarget,
        rookMove: null // rok durumunda
      };

      // Rok durumu
      if (piece.type === 'king' && Math.abs(toCol - fromCol) === 2) {
        let step = toCol - fromCol > 0 ? 1 : -1;
        let rookFromCol = (step === 1) ? 7 : 0;
        let rookToCol = fromCol + step;
        let rook = board[fromRow][rookFromCol];
        board[fromRow][rookFromCol] = null;
        board[fromRow][rookToCol] = rook;
        moveRecord.rookMove = { from: { row: fromRow, col: rookFromCol }, to: { row: fromRow, col: rookToCol }, piece: { ...rook } };
        rook.firstMove = false;
      }

      // En passant alımı
      if (piece.type === 'pawn') {
        if (!target && Math.abs(toCol - fromCol) === 1 && Math.abs(toRow - fromRow) === 1) {
          // Hamlede alınan piyon en passant ile alınıyor
          let pawnRow = piece.color === 'white' ? toRow + 1 : toRow - 1;
          moveRecord.captured = { ...board[pawnRow][toCol] };
          board[pawnRow][toCol] = null;
          // Ayrıca DOM'dan da kaldırılması gerekir
          removeCapturedPieceDOM(piece.color === 'white' ? blackCapturedEl : whiteCapturedEl, pieceSymbols[board[pawnRow][toCol]?.color || ''][board[pawnRow][toCol]?.type] );
        }
      }

      board[toRow][toCol] = piece;
      board[fromRow][fromCol] = null;
      piece.firstMove = false;

      // Terfi: piyon hedef satıra ulaşırsa
      if (piece.type === 'pawn' && (toRow === 0 || toRow === 7)) {
        let promoteTo = prompt("Terfi! 'queen', 'rook', 'bishop' veya 'knight' seçin:", "queen");
        if (!['queen','rook','bishop','knight'].includes(promoteTo)) promoteTo = 'queen';
        piece.type = promoteTo;
      }

      // En passant hedefini ayarla: piyon çift hamle yaptıysa aradaki kare alınabilir
      if (piece.type === 'pawn' && Math.abs(toRow - fromRow) === 2) {
        enPassantTarget = { row: (fromRow + toRow) / 2, col: fromCol };
      } else {
        enPassantTarget = null;
      }

      moveHistory.push(moveRecord);
      // Turn değiştir
      currentTurn = (currentTurn === 'white') ? 'black' : 'white';
    }

    // Hamle geri alma
    function undoMove() {
      if (moveHistory.length === 0) return;
      const lastMove = moveHistory.pop();
      const { from, to, piece, captured, enPassantTarget: prevEPTarget, rookMove } = lastMove;
      board[from.row][from.col] = piece;
      board[to.row][to.col] = captured;
      // Eğer en passant ile alınma varsa, geri koy
      if (piece.type === 'pawn' && Math.abs(to.col - from.col) === 1 && !captured) {
        let pawnRow = piece.color === 'white' ? to.row + 1 : to.row - 1;
        board[pawnRow][to.col] = { type: 'pawn', color: (piece.color === 'white' ? 'black' : 'white'), firstMove: false };
      }
      // Rok geri al
      if (rookMove) {
        const { from: rFrom, to: rTo, piece: rookPiece } = rookMove;
        board[rFrom.row][rFrom.col] = rookPiece;
        board[rTo.row][rTo.col] = null;
      }
      enPassantTarget = prevEPTarget;
      currentTurn = piece.color;
      renderBoard();
    }

    function removeCapturedPieceDOM(container, symbol) {
      // Basitçe container içeriğini güncelle
      // (Bu örnekte DOM senkronizasyonu en temel düzeyde tutuldu.)
    }

    // Oyun durumunu kontrol et: check, mat veya stalemate
    function checkGameState() {
      // Eğer mevcut oyuncunun hamle yapacak yasal hamlesi yoksa:
      let movesAvailable = false;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          let p = board[r][c];
          if (p && p.color === currentTurn) {
            let legal = getLegalMoves(r, c, p);
            if (legal.length > 0) {
              movesAvailable = true;
              break;
            }
          }
        }
        if (movesAvailable) break;
      }
      if (!movesAvailable) {
        if (isKingInCheck(currentTurn)) {
          alert("Mat! " + (currentTurn === 'white' ? "Siyah" : "Beyaz") + " kazandı.");
        } else {
          alert("Pat! Oyun berabere.");
        }
      }
    }

    // Başlangıç ayarları
    initBoard();
    renderBoard();

    undoButton.addEventListener('click', () => {
      undoMove();
    });
  </script>
</body>
</html>
